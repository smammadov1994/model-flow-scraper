# Local n8n for the model-finder ingestion workflow.
# UI: http://localhost:5679  (5678 is left free for the separate ods-n8n container)
services:
  n8n:
    image: n8nio/n8n:2.6.4
    container_name: model-finder-n8n
    ports:
      - "127.0.0.1:5679:5678"
    env_file: .env
    environment:
      - GENERIC_TIMEZONE=America/New_York
      - TZ=America/New_York
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
      # Lets HTTP nodes read REPLICATE_API_TOKEN from .env. Only that token is passed in.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - NODE_OPTIONS=--max-old-space-size=4096
      # Keep the database small: each run stores its data, so only keep the last 30 runs / 7 days.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=30
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./workflow.json:/workflows/workflow.json:ro
      - ../data:/data
    restart: unless-stopped

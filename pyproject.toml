[project]
name = "model-finder"
version = "0.1.0"
description = "Find the right Hugging Face model for a plain-English need, with on-device fit estimates."
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=17",
  "huggingface_hub>=0.30",
  "httpx>=0.27",
  "qdrant-client[fastembed]>=1.15",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sentence-transformers>=6.1",
  "transformers>=5.19",
  "torch>=2.6",
  "typesafe-sdk>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
model-finder = "model_finder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_finder"]
